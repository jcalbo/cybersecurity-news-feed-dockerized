version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybersecurity-news-backend
    ports:
      - "8000:8000"
    environment:
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - cybersecurity-network

  # Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybersecurity-news-frontend
    ports:
      - "8501:8501"
    environment:
      - API_SERVER_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cybersecurity-network

networks:
  cybersecurity-network:
    driver: bridge

volumes:
  # Optional: Add volumes for persistent data if needed
  cache-data:

